# The app's version, as a single counter.
#
# One number, bumped by one for every *real* update — a batch of new features or fixes that
# changes what the app does. Renames, re-signings and CI rebuilds of the same app are not
# updates and do not move it. versionName is derived from it in app/build.gradle.kts, which
# is what keeps the number shown inside the app and the one Android shows on the app's
# details page from ever drifting apart.
#
# 1.1 first playable build · 1.2 install/signing fixes · 1.3 in-app drawing, menus and
# settings · 1.4 four game types, straightened lines, autosave · 1.5 the sticker UI ·
# 1.6 creatures, ink read as lines, a real eraser · 1.7 this one: the AI level designer and
# the PaperEngine name. The release notes shown inside the app are in ui/WhatsNewScreen.kt,
# and have to gain an entry whenever this number moves.
versionCode=7
