# The app's version, as a single counter.
#
# One number, bumped by one for every build handed over, so the version always says how
# many releases there have been. versionName is derived from it in app/build.gradle.kts,
# which is what keeps the number shown inside the app and the one Android shows in the
# app's details page from ever drifting apart.
#
# History: six builds were released from this branch before the counter existed, all of
# them stamped 1.0 because the version was hard-coded. This one is the seventh.
versionCode=7
