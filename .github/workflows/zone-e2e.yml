# Temporary: run the app's real safe-zone code (OverpassChecker + ZonePlanner)
# against the live Overpass servers from a plain JVM.
name: Safe zone end-to-end check

on:
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/zone-e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build a JVM harness around the app's code
        run: |
          mkdir -p e2e/src/main/kotlin/org/osmdroid/util
          cd e2e
          cp ../gradle -r . && cp ../gradlew .
          echo 'rootProject.name = "e2e"' > settings.gradle.kts
          cat > build.gradle.kts <<'G'
          plugins { kotlin("jvm") version "1.9.24"; application }
          repositories { mavenCentral() }
          dependencies {
              implementation("org.json:json:20240303")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1")
          }
          application { mainClass.set("MainKt") }
          G
          mkdir -p src/main/kotlin/android/os
          echo 'package android.os
          object SystemClock { @JvmStatic fun elapsedRealtime(): Long = System.nanoTime() / 1_000_000 }' > src/main/kotlin/android/os/SystemClock.kt
          echo 'package org.osmdroid.util
          class GeoPoint(var latitude: Double, var longitude: Double) { override fun toString() = "(%.6f, %.6f)".format(latitude, longitude) }' > src/main/kotlin/org/osmdroid/util/GeoPoint.kt
          A=../app/src/main/java/com/lava/floorislava
          cp $A/GeoUtils.kt $A/ArMath.kt $A/OverpassChecker.kt $A/ZonePlanner.kt src/main/kotlin/
          python3 - <<'P'
          s=open('../app/src/main/java/com/lava/floorislava/GamePrefs.kt').read()
          s=s[:s.index('/** Settings and lifetime stats')].replace('import android.content.Context\nimport android.content.SharedPreferences\n','')
          open('src/main/kotlin/Difficulty.kt','w').write(s)
          P
          cat > src/main/kotlin/Main.kt <<'M'
          import com.lava.floorislava.*
          import kotlinx.coroutines.runBlocking
          import org.json.JSONObject
          import org.osmdroid.util.GeoPoint
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          // Independent check: distance from the zone centre to the nearest car road centreline.
          fun nearestRoad(z: GeoPoint): String {
              val q = "[out:json][timeout:25];way[\"highway\"~\"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|road|busway)(_link)?$\"](around:60,${z.latitude},${z.longitude});out geom;"
              for (ep in listOf("https://overpass-api.de/api/interpreter", "https://maps.mail.ru/osm/tools/overpass/api/interpreter", "https://overpass.private.coffee/api/interpreter")) {
                  try {
                      val c = URL(ep).openConnection() as HttpURLConnection
                      c.requestMethod = "POST"; c.doOutput = true; c.connectTimeout = 10000; c.readTimeout = 30000
                      c.setRequestProperty("User-Agent", "FloorIsLava/1.2 (Android game; github.com/poodicraft/The-Floor-Is-Lava)")
                      c.outputStream.use { it.write(("data=" + URLEncoder.encode(q, "UTF-8")).toByteArray()) }
                      if (c.responseCode != 200) continue
                      val els = JSONObject(c.inputStream.bufferedReader().readText()).getJSONArray("elements")
                      var best = Double.MAX_VALUE; var kind = "none within 60 m"
                      for (i in 0 until els.length()) {
                          val e = els.getJSONObject(i); val g = e.optJSONArray("geometry") ?: continue
                          val pts = (0 until g.length()).map { GeoPoint(g.getJSONObject(it).getDouble("lat"), g.getJSONObject(it).getDouble("lon")) }
                          for (k in 0 until pts.size - 1) {
                              // sample the segment densely
                              for (t in 0..20) {
                                  val p = GeoPoint(pts[k].latitude + (pts[k+1].latitude - pts[k].latitude) * t / 20.0, pts[k].longitude + (pts[k+1].longitude - pts[k].longitude) * t / 20.0)
                                  val d = GeoUtils.distanceMeters(z, p)
                                  if (d < best) { best = d; kind = e.getJSONObject("tags").optString("highway") }
                              }
                          }
                      }
                      return if (best == Double.MAX_VALUE) kind else "nearest road %.1f m (%s)".format(best, kind)
                  } catch (_: Exception) {}
              }
              return "road check unavailable"
          }

          fun main() = runBlocking {
              val places = listOf(
                  "Tel Aviv, Rabin Square" to GeoPoint(32.0809, 34.7806),
                  "Tel Aviv, dense street (Allenby)" to GeoPoint(32.0680, 34.7717),
                  "Jerusalem, Sacher Park" to GeoPoint(31.7815, 35.2050),
                  "London, Hyde Park" to GeoPoint(51.5073, -0.1657),
                  "New York, Midtown" to GeoPoint(40.7549, -73.9840)
              )
              for ((name, p) in places) {
                  OverpassChecker.prefetch(p)
                  kotlinx.coroutines.delay(2000)
                  for (d in listOf(Difficulty.NORMAL, Difficulty.HARD)) {
                      val t0 = System.currentTimeMillis()
                      val out = ZonePlanner.planSingle(p, d, checkMap = true)
                      val ms = System.currentTimeMillis() - t0
                      val desc = when (out) {
                          is PlanOutcome.Planned -> "PLANNED at %.1f m | %s | zone radius %.0f m".format(out.plan.distanceM, nearestRoad(out.plan.hostZone), d.zoneRadiusM)
                          PlanOutcome.MapUnavailable -> "MAP UNAVAILABLE"
                          PlanOutcome.NoOpenSpace -> "NO OPEN SPACE"
                      }
                      println("E2E $name | ${d.label} | $desc | ${ms} ms")
                  }
              }
              System.exit(0)
          }
          M
      - name: Run against the live Overpass servers
        working-directory: e2e
        run: ./gradlew --no-daemon -q run
