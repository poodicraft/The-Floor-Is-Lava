# Temporary: run the app's real safe-zone code (OverpassChecker + ZonePlanner)
# against the live Overpass servers from a plain JVM.
name: Safe zone end-to-end check

on:
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/zone-e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build a JVM harness around the app's code
        run: |
          mkdir -p e2e/src/main/kotlin/org/osmdroid/util
          cd e2e
          cp ../gradle -r . && cp ../gradlew .
          echo 'rootProject.name = "e2e"' > settings.gradle.kts
          cat > build.gradle.kts <<'G'
          plugins { kotlin("jvm") version "1.9.24"; application }
          repositories { mavenCentral() }
          dependencies {
              implementation("org.json:json:20240303")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1")
          }
          application { mainClass.set("MainKt") }
          G
          echo 'package org.osmdroid.util
          class GeoPoint(var latitude: Double, var longitude: Double) { override fun toString() = "(%.6f, %.6f)".format(latitude, longitude) }' > src/main/kotlin/org/osmdroid/util/GeoPoint.kt
          A=../app/src/main/java/com/lava/floorislava
          cp $A/GeoUtils.kt $A/ArMath.kt $A/OverpassChecker.kt $A/ZonePlanner.kt src/main/kotlin/
          python3 - <<'P'
          s=open('../app/src/main/java/com/lava/floorislava/GamePrefs.kt').read()
          s=s[:s.index('/** Settings and lifetime stats')].replace('import android.content.Context\nimport android.content.SharedPreferences\n','')
          open('src/main/kotlin/Difficulty.kt','w').write(s)
          P
          cat > src/main/kotlin/Main.kt <<'M'
          import com.lava.floorislava.*
          import kotlinx.coroutines.runBlocking
          import org.osmdroid.util.GeoPoint

          fun main() = runBlocking {
              val places = listOf(
                  "Tel Aviv, Rabin Square" to GeoPoint(32.0809, 34.7806),
                  "Tel Aviv, dense street (Allenby)" to GeoPoint(32.0680, 34.7717),
                  "Jerusalem, Sacher Park" to GeoPoint(31.7815, 35.2050),
                  "London, Hyde Park" to GeoPoint(51.5073, -0.1657),
                  "New York, Midtown" to GeoPoint(40.7549, -73.9840)
              )
              for ((name, p) in places) {
                  for (d in listOf(Difficulty.NORMAL, Difficulty.HARD)) {
                      val t0 = System.currentTimeMillis()
                      val out = ZonePlanner.planSingle(p, d, checkMap = true)
                      val ms = System.currentTimeMillis() - t0
                      val desc = when (out) {
                          is PlanOutcome.Planned -> "PLANNED zone ${out.plan.hostZone} at %.1f m".format(out.plan.distanceM)
                          PlanOutcome.MapUnavailable -> "MAP UNAVAILABLE"
                          PlanOutcome.NoOpenSpace -> "NO OPEN SPACE"
                      }
                      println("E2E $name | ${d.label} | $desc | ${ms} ms")
                  }
              }
              val a = GeoPoint(32.0809, 34.7806); val b = GeoUtils.destination(a, 25.0, 70.0)
              val shared = ZonePlanner.plan(a, b, Difficulty.NORMAL, checkMap = true)
              println("E2E multiplayer together | $shared")
              if (shared is PlanOutcome.Planned) println("E2E   distances %.2f / %.2f".format(GeoUtils.distanceMeters(a, shared.plan.hostZone), GeoUtils.distanceMeters(b, shared.plan.guestZone)))
              val far = GeoPoint(31.7815, 35.2050)
              val apart = ZonePlanner.plan(a, far, Difficulty.NORMAL, checkMap = true)
              println("E2E multiplayer apart | $apart")
              if (apart is PlanOutcome.Planned) println("E2E   distances %.2f / %.2f".format(GeoUtils.distanceMeters(a, apart.plan.hostZone), GeoUtils.distanceMeters(far, apart.plan.guestZone)))
              System.exit(0)
          }
          M
      - name: Run against the live Overpass servers
        working-directory: e2e
        run: ./gradlew --no-daemon -q run
