name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/BookQuest.apk
          ls -lh out

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookQuest-apk
          path: out/BookQuest.apk
          if-no-files-found: error

      - name: Publish the APK to the rolling release
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest out/BookQuest.apk \
            --title "BookQuest APK (latest build)" \
            --notes "Debug APK built from ${{ github.sha }} on branch ${{ github.ref_name }}. Download BookQuest.apk and install it on an Android phone (Android 7.0 or newer)." \
            --prerelease
