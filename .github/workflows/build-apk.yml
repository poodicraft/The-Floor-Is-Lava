name: Build Floor Is Lava APK

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the APK
        timeout-minutes: 30
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug

      - name: Collect the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/FloorIsLava.apk
          ls -lh out

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloorIsLava-apk
          path: out/FloorIsLava.apk
          if-no-files-found: error

      # Rolling pre-release so the APK can be downloaded straight to a phone.
      # Uses its own tag so it does not replace the "apk-latest" release.
      - name: Publish the APK to the rolling release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete floor-is-lava-apk --yes --cleanup-tag || true
          gh release create floor-is-lava-apk out/FloorIsLava.apk \
            --target "${{ github.sha }}" \
            --title "Floor Is Lava APK (latest build)" \
            --notes "Debug APK built from ${{ github.sha }} on branch ${{ github.ref_name }}. Download FloorIsLava.apk and install it on an Android phone (Android 8.0 or newer)." \
            --prerelease
